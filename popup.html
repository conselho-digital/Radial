<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Radial</title>
<script src="theme-init.js"></script>
<link rel="stylesheet" href="ui.css">
</head>
<body class="popup">
<div class="wrap">
  <header class="pop-head">
    <svg class="logo" viewBox="0 0 48 48" aria-hidden="true">
      <g stroke="var(--bg)" stroke-width="2" stroke-linejoin="round">
        <path d="M24 3a21 21 0 0 1 14.85 6.15L31.8 16.2A11 11 0 0 0 24 13z" fill="#2563eb"/>
        <path d="M38.85 9.15A21 21 0 0 1 45 24H35a11 11 0 0 0-3.2-7.8z" fill="#9aa3b8"/>
        <path d="M45 24a21 21 0 0 1-6.15 14.85L31.8 31.8A11 11 0 0 0 35 24z" fill="#b6bdcc"/>
        <path d="M38.85 38.85A21 21 0 0 1 24 45V35a11 11 0 0 0 7.8-3.2z" fill="#9aa3b8"/>
        <path d="M24 45a21 21 0 0 1-14.85-6.15L16.2 31.8A11 11 0 0 0 24 35z" fill="#b6bdcc"/>
        <path d="M9.15 38.85A21 21 0 0 1 3 24h10a11 11 0 0 0 3.2 7.8z" fill="#9aa3b8"/>
        <path d="M3 24a21 21 0 0 1 6.15-14.85L16.2 16.2A11 11 0 0 0 13 24z" fill="#b6bdcc"/>
        <path d="M9.15 9.15A21 21 0 0 1 24 3v10a11 11 0 0 0-7.8 3.2z" fill="#9aa3b8"/>
      </g>
      <circle cx="24" cy="24" r="5" fill="#2563eb"/>
    </svg>
    <div class="site"><b id="siteName">Radial</b><span id="siteSub"></span></div>
    <button class="btn icon" id="openOpts" type="button" title="Todas as configurações" aria-label="Todas as configurações">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>

  <div id="unsupported" class="note hidden">Esta página (chrome://, loja de extensões, visualizador de PDF…) não aceita o radial. Abra um site comum para adicionar opções.</div>

  <main id="main">
    <section class="card" id="savedCard">
      <div class="card-head">
        <h2>Opções deste site</h2>
        <p class="lead" id="savedLead"></p>
      </div>
      <ul class="list" id="list"></ul>
    </section>

    <section class="card" aria-labelledby="h-add">
      <div class="card-head">
        <h2 id="h-add">Adicionar opção ao radial</h2>
      </div>
      <div id="editor"></div>
    </section>

    <div class="pop-foot">
      <button class="btn" id="openNow" type="button">Abrir radial agora</button>
    </div>
  </main>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="sites.js"></script>
<script src="store.js"></script>
<script src="editor.js"></script>
<script src="popup.js"></script>
</body>
</html>
